name: Mobile owner contract autofix

on:
  push:
    branches:
      - fix/mobile-owner-build-contract

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: game/package-lock.json
      - name: Move joystick contract to single owner
        working-directory: game
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/build-system.mjs')
          s = p.read_text()
          old = "assert.match(main, /const joystick = document\\.querySelector\\('\\[data-mobile-joystick\\]'\\)/, 'App must wire up the joystick drag element');\nassert.match(main, /game\\.events\\.emit\\('mobile-move', direction\\)/, 'The joystick must send movement directions while dragging');\nassert.match(main, /setDirection\\(null\\)/, 'The joystick must clear movement direction on release');"
          new = "const mobileOwner = await readFile(new URL('../src/systems/mobile-input-single-owner-v1.js', import.meta.url), 'utf8');\nassert.match(mobileOwner, /const joystickNode = root\\.querySelector\\('\\[data-mobile-joystick\\]'\\)/, 'Single mobile owner must wire the joystick drag element');\nassert.match(mobileOwner, /mobile-move|setPhaserDirection/, 'Single mobile owner must route joystick movement');\nassert.match(mobileOwner, /setDirection\\(null\\)/, 'Single mobile owner must clear movement direction on release');\nassert.doesNotMatch(main, /data-mobile-joystick|mobile-move|activePointerId/, 'main.js must not own mobile joystick dispatch');"
          if old not in s:
              raise SystemExit('expected joystick assertions were not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Install
        working-directory: game
        run: npm ci
      - name: Release hardening
        working-directory: game
        run: npm run test:release-hardening
      - name: Production build
        working-directory: game
        run: npm run build
      - name: Commit contract fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/tests/build-system.mjs
          git commit -m 'test: align build contract with mobile input owner' || exit 0
          git push
