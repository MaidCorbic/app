name: Gameplay Hardening

on:
  pull_request:
    paths:
      - 'game/**'
      - '.github/workflows/gameplay-hardening.yml'
  push:
    branches:
      - main

jobs:
  gameplay-hardening:
    name: Gameplay Hardening Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package.json

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run final stability suite
        run: npm run test:final-stability
