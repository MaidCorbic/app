name: Verify Mobile Owner Contract

on:
  push:
    branches: [fix/mobile-owner-build-contract]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci
      - run: node tests/build-system.mjs
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - run: npm run test:release-hardening
      - run: npm run build
