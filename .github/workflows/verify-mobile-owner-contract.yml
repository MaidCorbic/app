name: Verify Mobile Owner Contract

on:
  push:
    branches: [fix/mobile-owner-build-contract]
  pull_request:
    branches: [main]

# A PR only needs the newest owner-contract validation. Cancel stale queued
# attempts instead of letting every commit consume another runner slot.
concurrency:
  group: verify-mobile-owner-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci
      - run: node tests/build-system.mjs
      - run: npm run test:release-hardening
      - run: npm run build
