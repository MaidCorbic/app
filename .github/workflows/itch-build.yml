name: Build Runner Relay itch.io package

on:
  push:
    branches:
      - main
    paths:
      - 'game/**'
      - '.github/workflows/itch-build.yml'
  workflow_dispatch:

jobs:
  build-itch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: game/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build production game
        run: npm run build
      - name: Verify browser entrypoint
        run: test -f dist/index.html
      - name: Upload itch.io-ready files
        uses: actions/upload-artifact@v4
        with:
          name: runner-relay-public-beta
          path: game/dist
          if-no-files-found: error
