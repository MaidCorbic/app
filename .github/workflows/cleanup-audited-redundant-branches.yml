name: Cleanup audited redundant branches

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only explicitly audited redundant branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          audited=(
            "restore-cazxp7n9j-squash"
            "fix/options-final2"
            "fix/options-final5"
          )
          for branch in "${audited[@]}"; do
            [ "$branch" != "$DEFAULT_BRANCH" ] || continue
            open_count="$(gh pr list --repo "$REPO" --state open --head "$branch" --json number --jq 'length')"
            [ "$open_count" = "0" ] || continue
            if gh api "repos/$REPO/git/ref/heads/$branch" >/dev/null 2>&1; then
              echo "Deleting audited redundant branch: $branch"
              gh api --method DELETE "repos/$REPO/git/refs/heads/$branch"
            fi
          done
