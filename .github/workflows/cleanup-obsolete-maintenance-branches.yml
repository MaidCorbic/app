name: Cleanup obsolete maintenance branches

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete clearly obsolete maintenance branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' |
          while IFS= read -r branch; do
            [ -n "$branch" ] || continue
            [ "$branch" != "$DEFAULT_BRANCH" ] || continue

            case "$branch" in
              backup/*|restore/*|rollback/*|merge-*|tmp|tmp-*|temp-check|MaidCorbic-patch-*) ;;
              *) continue ;;
            esac

            open_count="$(gh pr list --repo "$REPO" --state open --head "$branch" --json number --jq 'length')"
            [ "$open_count" = "0" ] || continue

            echo "Deleting obsolete maintenance branch: $branch"
            gh api --method DELETE "repos/$REPO/git/refs/heads/$branch"
          done
