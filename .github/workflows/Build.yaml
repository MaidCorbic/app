# This file is used to build the images for a deployment in GitHub actions.
# For more information, see https://diploi.com/ci

name: Build Components

on:
  # Image builds are deployment work, not PR validation. Keeping this on main
  # prevents every feature-branch push from creating an extra queued runner job.
  push:
    branches:
      - main

concurrency:
  group: build-components-${{ github.ref }}
  cancel-in-progress: true

jobs:
  define-components:
    name: Define Components
    runs-on: ubuntu-24.04
    outputs:
      components: ${{ steps.diploi-meta.outputs.components }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: diploi-meta
        name: Diploi meta
        uses: diploi/action-components@v1.8

  run-builds:
    name: Build ${{ matrix.name }} ${{ matrix.stage }}
    runs-on: ubuntu-24.04-arm
    needs: define-components
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.define-components.outputs.components) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Diploi build
        uses: diploi/action-build@v1.12
        with: ${{ matrix }}
        env:
          project: ${{ secrets.DIPLOI_REGISTRY_PROJECT }}
          registry: ${{ secrets.DIPLOI_REGISTRY_HOSTNAME }}
          username: ${{ secrets.DIPLOI_REGISTRY_USERNAME }}
          password: ${{ secrets.DIPLOI_REGISTRY_PASSWORD }}
